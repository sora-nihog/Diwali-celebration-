
<!DOCTYPE html>
<html>
<head>
<title>SORA WINDOW SIMULATOR</title>
<style>
body {
  background:#080d18;
  color:#00ff88;
  font-family:Arial;
  text-align:center;
  padding:20px;
}
button {
  padding:15px 25px;
  margin:10px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
#on {background:#00ff88;}
#off {background:#ff4444;color:white;}
#screen {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:20px;
}
.window {
  background:#142438;
  border:1px solid #00ff88;
  padding:12px 3px;
  border-radius:5px;
  font-size:12px;
}
</style>
</head>
<body>

<h1>⚡ SORA 500 WINDOWS</h1>
<p id="status">SYSTEM OFF</p>

<button id="on" onclick="start()">ON 500 WINDOWS</button>
<button id="off" onclick="stop()">OFF</button>

<h3 id="count">0 / 500</h3>
<div id="screen"></div>

<script>
let running = false;
let timer;
let count = 0;

function start() {
  if (running) return;

  running = true;
  count = 0;
  document.getElementById("screen").innerHTML = "";
  document.getElementById("status").textContent =
    "SIMULATION RUNNING";

  timer = setInterval(() => {
    if (!running) return;

    for (let i = 0; i < 10 && count < 500; i++) {
      count++;

      const win = document.createElement("div");
      win.className = "window";
      win.textContent = "WINDOW " + count;

      document.getElementById("screen").appendChild(win);
    }

    document.getElementById("count").textContent =
      count + " / 500";

    if (count >= 500) {
      stop();
      document.getElementById("status").textContent =
        "500 WINDOWS SIMULATED!";
    }
  }, 100);
}

function stop() {
  running = false;
  clearInterval(timer);

  if (count < 500) {
    document.getElementById("status").textContent =
      "SIMULATION STOPPED";
  }
}
</script>

</body>
</html>
